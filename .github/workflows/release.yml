name: Release

# Tag a commit to ship:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: glyph-sleuth-windows-x64.exe
          - os: macos-latest
            name: glyph-sleuth-macos-arm64
          - os: ubuntu-22.04
            name: glyph-sleuth-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Qt needs these even offscreen, and the runner has almost no fonts.
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 fonts-dejavu fonts-noto-core
      - run: pip install -r requirements.txt pyinstaller
      # Gate: no binary ships from a commit that fails its own checks.
      - name: Tests
        run: |
          python test_core.py
          python test_app.py
      - name: Build
        run: pyinstaller --onefile --windowed --name glyph-sleuth app.py
      - name: Rename
        shell: bash
        run: mv dist/glyph-sleuth${{ startsWith(matrix.os, 'windows') && '.exe' || '' }} "dist/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        # Pre-release until 1.0 — drop the flag when you cut it.
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease --title "$GITHUB_REF_NAME"
