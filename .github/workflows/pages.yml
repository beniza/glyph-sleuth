name: Web

# The index is rebuilt here, never committed: fonts.json is derived data, and a
# monthly rebuild is how a new Google or SIL release turns up on the site.
on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/gen_web_index.py", "chars.py", "langs.py", "ucd.py", ".github/workflows/pages.yml"]
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt brotli
      # Gate: the web core has to agree with chars.py before it goes anywhere.
      - run: node web/test-core.mjs
      - name: Build index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/gen_web_index.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
