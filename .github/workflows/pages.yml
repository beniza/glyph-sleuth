# Build the site and publish it to GitHub Pages.
#
# The generator reads font releases to measure them and writes only JSON; the
# renderer turns that into static HTML. No font file is ever written into the
# published site — see test_gen.test_no_font_is_ever_served, which gates this.
name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', 'site/**', '.github/workflows/pages.yml']
  schedule:
    # Font releases and Unicode data move; a monthly rebuild keeps the numbers
    # honest without anyone remembering to press a button.
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt

      # Facts read from font files last time, keyed on the URL of the exact file
      # they came from. A warm cache skips the download, the parse and the
      # shaping for every family whose release has not moved — most of the
      # generator's work. Facts only: no font binary is ever cached.
      - uses: actions/cache@v4
        with:
          path: web/data/cache
          key: font-facts-${{ github.run_id }}
          restore-keys: font-facts-

      # The tests are the gate: a red suite must not reach the site.
      - run: node web/tests/test-core.mjs
      - run: python shared/test_core.py
      - run: python web/build/test_gen.py
      - run: python web/build/test_render.py

      - run: python web/build/gen_index.py
        env:
          # Unauthenticated GitHub API is 60 requests an hour, which fails
          # partway through the foundry listings.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python web/build/render.py

      # Checks the served tables against the code that reads them: a rename in
      # the generator would leave Inspect reading nothing while every unit test
      # still passed, so this runs after the build rather than before it.
      - run: node web/tests/test-inspect.mjs

      # What only a browser can answer, against the built site served the way
      # Pages serves it. Every bug in this project that reached a deploy was of
      # one kind: a page that passed every unit test and was wrong when someone
      # looked at it.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
