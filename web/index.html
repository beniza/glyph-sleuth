<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glyph Sleuth — which public font can draw this?</title>
<meta name="description" content="Type a character, a codepoint, a property or a language: see which freely available fonts can set it, and download the one that can.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>✱</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The chrome is set in Newsreader so the specimens are the only voice on the
     page that belongs to the fonts themselves. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="masthead">
    <div class="wordmark">Glyph Sleuth <span>web</span></div>
    <div class="omnibox">
      <span class="mark">✱</span>
      <input id="omni" type="search" autofocus spellcheck="false" autocomplete="off"
             placeholder="a character, U+2731, heavy asterisk, \p{Script=Devanagari}, Dingbats, Hindi…"
             aria-label="Search characters, properties, blocks, fonts and languages">
    </div>
  </div>
  <div id="echo"></div>
  <nav role="tablist">
    <button role="tab" data-mode="search" aria-selected="true">Search</button>
    <button role="tab" data-mode="preview" aria-selected="false">Preview</button>
    <button role="tab" data-mode="browse" aria-selected="false">Browse</button>
    <button role="tab" data-mode="language" aria-selected="false">Language &amp; script</button>
    <button role="tab" data-mode="convert" aria-selected="false">Convert</button>
  </nav>
  <div id="specimen-bar" hidden>
    <label for="size">Size</label>
    <input id="size" type="range" min="14" max="120" step="1" value="34"
           aria-label="Specimen size in pixels">
    <output id="size-out" for="size">34<span>px</span></output>
    <div class="ladder" role="group" aria-label="Preset sizes">
      <button type="button" data-size="18">18</button>
      <button type="button" data-size="24">24</button>
      <button type="button" data-size="34">34</button>
      <button type="button" data-size="48">48</button>
      <button type="button" data-size="72">72</button>
    </div>
  </div>
</header>

<main>
  <section id="search">
    <div class="wrap">
      <div class="results" id="search-results"><p class="status">Loading the font index…</p></div>
      <aside class="inspector" id="inspector"></aside>
    </div>
  </section>

  <section id="preview" hidden>
    <div class="controls">
      <label for="preview-lang">Sample text</label>
      <select id="preview-lang"></select>
      <button class="ghost" id="preview-run">Rank fonts</button>
    </div>
    <textarea id="preview-text" spellcheck="false" rows="3"></textarea>
    <div id="preview-results"></div>
  </section>

  <section id="browse" hidden>
    <div class="controls">
      <label for="browse-block">Block</label>
      <select id="browse-block"></select>
      <label for="browse-font">Font</label>
      <select id="browse-font"></select>
    </div>
    <div id="browse-grid"></div>
  </section>

  <section id="language" hidden>
    <div class="controls">
      <label for="lang-pick">Language</label>
      <select id="lang-pick"></select>
      <label for="script-pick">Script</label>
      <select id="script-pick"></select>
    </div>
    <div class="atlas">
      <aside id="lang-side"></aside>
      <div id="script-main"></div>
    </div>
  </section>

  <section id="convert" hidden>
    <div class="wrap">
      <div class="results">
        <h2>Text</h2>
        <textarea id="convert-text" spellcheck="false" placeholder="Type or paste anything"></textarea>
        <h2 style="margin-top:14px">Codepoints</h2>
        <textarea id="convert-cps" spellcheck="false" placeholder="U+0915 U+094D or 41 42 43 or E0 A4 95"></textarea>
        <p class="faint" id="convert-note"></p>
      </div>
      <aside class="inspector"><div id="convert-table"></div></aside>
    </div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
